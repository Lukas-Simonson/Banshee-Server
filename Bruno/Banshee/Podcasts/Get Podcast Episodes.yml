info:
  name: Get Podcast Episodes
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseURL}}/api/podcasts/:podcastID/episodes"
  params:
    - name: podcastID
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get Podcast Episodes

  Returns episode metadata for episodes in the podcast with the provided id.

  ## Query Parameters

  | name            | description                                                                | type                                  | default    |
  |-----------------|----------------------------------------------------------------------------|---------------------------------------|------------|
  | config          | Controls how the episode confis are utilized.                              | String(`none`, `include`, `override`) | `override` |
  | includeAudio    | Controls if audio information is included for the episodes.                | Bool(`true`, `false`)                 | `false`    |
  | includeProgress | Controls if the authenticated users progress is included for the episodes. | Bool(`true`, `false`)                 | `false`.   |
