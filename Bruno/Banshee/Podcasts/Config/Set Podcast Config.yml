info:
  name: Set Podcast Config
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseURL}}/api/podcasts/:podcastID/config"
  params:
    - name: podcastID
      value: ""
      type: path
  body:
    type: json
    data: |-
      // Example:
      //
      // {
      //   "title": "Dungeon Dads",
      //   "imageURL": "https://example.com/image.png",
      //   "description": "Haha funny podcast."
      // }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Set Podcast Config

  Updates the podcasts config with the one provided through the body of the request..

  ## Authentication
  - Required
  - Admin Role
  - Bearer Token

  ## Request Body

  | Name        | Description                                | Type        | Required |
  |-------------|--------------------------------------------|-------------|----------|
  | title       | The title of the podcast.                  | String      | no       |
  | imageURL    | The url for an image used for the podcast. | String(URL) | no       |
  | description | The description of the podcast.            | String      | no       |
