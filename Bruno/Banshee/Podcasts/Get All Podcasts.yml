info:
  name: Get All Podcasts
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseURL}}/api/podcasts"
  params:
    - name: config
      value: override
      type: query
      disabled: true
    - name: includeRSS
      value: "false"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get All Podcasts

  Returns metadata for all podcasts tracked by the server.

  ## Query Parameters

  | name       | description                                                          | type                                  | default    |
  |------------|----------------------------------------------------------------------|---------------------------------------|------------|
  | config     | Controls how the podcast configs are utilized                        | String('none', 'include', 'override') | 'override' |
  | includeRSS | Controls if the podcast RSS Feeds should be included in the response | Bool('true', 'false')                 | 'false'    |
