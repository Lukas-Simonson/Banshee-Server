opencollection: 1.0.0

info:
  name: Banshee
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{authToken}}"
  variables:
    - name: baseURL
      value: http://localhost:6060
    - name: authToken
      value: <some auth token>
bundled: false
extensions: {}
