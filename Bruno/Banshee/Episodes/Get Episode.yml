info:
  name: Get Episode
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/api/episodes/:episodeID"
  params:
    - name: episodeID
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get Episode

  Returns metadata for the episode with the provided episode id.

  ## Query Parameters

  | name         | description                                                          | type                                  | default    |
  |--------------|----------------------------------------------------------------------|---------------------------------------|------------|
  | config       | Controls how the episodes config is utilized.                        | String('none', 'include', 'override') | 'override' |
  | includeAudio | Controls if audio information is included for the episodes.          | Bool(`true`, `false`)                 | `false`    |
