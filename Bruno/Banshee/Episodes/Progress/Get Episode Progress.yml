info:
  name: Get Episode Progress
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/api/episodes/:episodeID/progress"
  params:
    - name: episodeID
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get Episode Progress

  Gets the current progress of the episode with the provided id for the currently authenticated user.
