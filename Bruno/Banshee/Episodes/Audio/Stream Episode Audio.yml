info:
  name: Stream Episode Audio
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/api/episodes/:episodeID/audio"
  params:
    - name: episodeID
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Stream Episode Audio

  Attempts to stream audio from the server, falling back to a redirect to the episodes source.
